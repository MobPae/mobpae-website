<svg viewBox="0 0 1440 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g-blue" cx="26%" cy="52%" r="44%">
      <stop offset="0%" stop-color="#315EFF" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#315EFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-teal" cx="76%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-mid" cx="50%" cy="52%" r="24%">
      <stop offset="0%" stop-color="#315EFF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#315EFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-node-b" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5B7FFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#315EFF" stop-opacity=".18"/>
    </radialGradient>
    <radialGradient id="g-node-t" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity=".18"/>
    </radialGradient>
    <radialGradient id="g-node-c" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6B8FFF" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#315EFF" stop-opacity=".22"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.9" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <filter id="f-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="f-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="f-card" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha" result="blur"/>
      <feOffset dy="6" result="offset"/>
      <feComposite in="offset" in2="SourceGraphic" operator="out" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="500" fill="#070D1E"/>
  <rect width="1440" height="500" fill="url(#g-blue)"/>
  <rect width="1440" height="500" fill="url(#g-teal)"/>
  <rect width="1440" height="500" fill="url(#g-mid)"/>
  <rect width="1440" height="500" fill="url(#dots)"/>

  <!-- Arc glow layers -->
  <path d="M310,255 C450,140 580,140 720,255" fill="none" stroke="#315EFF" stroke-width="24" stroke-opacity=".1" filter="url(#f-glow)"/>
  <path d="M720,255 C860,140 990,140 1130,255" fill="none" stroke="#0D9488" stroke-width="24" stroke-opacity=".1" filter="url(#f-glow)"/>

  <!-- Arc dashed lines -->
  <path d="M310,255 C450,140 580,140 720,255" fill="none" stroke="#315EFF" stroke-width="1.5" stroke-opacity=".5" stroke-dasharray="5 9"/>
  <path d="M720,255 C860,140 990,140 1130,255" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-opacity=".5" stroke-dasharray="5 9"/>

  <!-- Arc nodes — left arc -->
  <circle cx="412" cy="190" r="4.5" fill="#070D1E" stroke="#315EFF" stroke-width="1.5" stroke-opacity=".65"/>
  <circle cx="412" cy="190" r="2"   fill="#315EFF" fill-opacity=".9"/>
  <circle cx="515" cy="169" r="6.5" fill="#070D1E" stroke="#315EFF" stroke-width="1.75" stroke-opacity=".8"/>
  <circle cx="515" cy="169" r="3"   fill="#315EFF"/>
  <circle cx="618" cy="190" r="4.5" fill="#070D1E" stroke="#315EFF" stroke-width="1.5" stroke-opacity=".65"/>
  <circle cx="618" cy="190" r="2"   fill="#315EFF" fill-opacity=".9"/>

  <!-- Arc nodes — right arc -->
  <circle cx="822" cy="190" r="4.5" fill="#070D1E" stroke="#0D9488" stroke-width="1.5" stroke-opacity=".65"/>
  <circle cx="822" cy="190" r="2"   fill="#0D9488" fill-opacity=".9"/>
  <circle cx="925" cy="169" r="6.5" fill="#070D1E" stroke="#0D9488" stroke-width="1.75" stroke-opacity=".8"/>
  <circle cx="925" cy="169" r="3"   fill="#0D9488"/>
  <circle cx="1028" cy="190" r="4.5" fill="#070D1E" stroke="#0D9488" stroke-width="1.5" stroke-opacity=".65"/>
  <circle cx="1028" cy="190" r="2"  fill="#0D9488" fill-opacity=".9"/>

  <!-- Card 1 — salary access -->
  <g transform="translate(432,55)">
    <rect width="168" height="86" rx="12" fill="#315EFF" fill-opacity=".12" transform="translate(3,5)"/>
    <rect width="168" height="86" rx="12" fill="#0C1530" stroke="#315EFF" stroke-opacity=".3" stroke-width="0.75"/>
    <rect width="168" height="2.5" rx="1.25" fill="#315EFF" fill-opacity=".9"/>
    <rect x="10" y="14" width="88" height="18" rx="5" fill="#315EFF" fill-opacity=".22"/>
    <text x="54" y="26" text-anchor="middle" font-size="9" font-family="Inter,sans-serif" fill="#7B9FFF" font-weight="600" letter-spacing=".09em">SALARY ACCESS</text>
    <text x="10" y="56" font-size="24" font-family="Inter,sans-serif" fill="white" font-weight="700">&#8377;8,200</text>
    <circle cx="14" cy="73" r="4" fill="#22C55E"/>
    <text x="24" y="76" font-size="10" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.5)">Auto-approved</text>
  </g>

  <!-- Card 2 — repayment -->
  <g transform="translate(840,55)">
    <rect width="164" height="86" rx="12" fill="#0D9488" fill-opacity=".12" transform="translate(3,5)"/>
    <rect width="164" height="86" rx="12" fill="#08201E" stroke="#0D9488" stroke-opacity=".3" stroke-width="0.75"/>
    <rect width="164" height="2.5" rx="1.25" fill="#0D9488" fill-opacity=".9"/>
    <rect x="10" y="14" width="68" height="18" rx="5" fill="#0D9488" fill-opacity=".3"/>
    <text x="44" y="26" text-anchor="middle" font-size="9" font-family="Inter,sans-serif" fill="#2DD4BF" font-weight="600" letter-spacing=".09em">REPAYMENT</text>
    <text x="10" y="53" font-size="14" font-family="Inter,sans-serif" fill="white" font-weight="600">Repaid at payroll</text>
    <text x="10" y="71" font-size="10" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.4)">Auto-deducted &#183; Zero friction</text>
  </g>

  <!-- EMPLOYER NODE -->
  <g transform="translate(310,255)">
    <circle r="58" fill="#315EFF" fill-opacity=".2" filter="url(#f-glow)"/>
    <circle r="86" fill="none" stroke="#315EFF" stroke-opacity=".16" stroke-width="0.75"/>
    <circle r="56" fill="url(#g-node-b)" stroke="#315EFF" stroke-opacity=".75" stroke-width="1.5"/>
    <!-- Building icon -->
    <rect x="-16" y="0" width="32" height="21" rx="1.5" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/>
    <polyline points="-20,0 0,-17 20,0" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-13" y="5" width="7" height="7" rx="1" fill="rgba(255,255,255,0.32)"/>
    <rect x="5"  y="5" width="7" height="7" rx="1" fill="rgba(255,255,255,0.48)"/>
    <rect x="-4" y="11" width="8" height="10" rx="1" fill="rgba(255,255,255,0.42)"/>
  </g>
  <text x="310" y="334" text-anchor="middle" font-size="11" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.35)" letter-spacing=".14em" font-weight="600">EMPLOYER</text>

  <!-- MOBPAE CENTER NODE -->
  <g transform="translate(720,255)">
    <circle r="70" fill="#315EFF" fill-opacity=".28" filter="url(#f-glow)"/>
    <circle r="112" fill="none" stroke="#315EFF" stroke-opacity=".09" stroke-width="0.75"/>
    <circle r="88"  fill="none" stroke="#315EFF" stroke-opacity=".14" stroke-width="0.75"/>
    <circle r="65"  fill="none" stroke="#315EFF" stroke-opacity=".24" stroke-width="1"/>
    <circle r="62"  fill="url(#g-node-c)" stroke="#315EFF" stroke-opacity=".85" stroke-width="1.75"/>
    <text x="0" y="15" text-anchor="middle" font-size="42" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.92)" font-weight="700">&#8377;</text>
  </g>
  <text x="720" y="344" text-anchor="middle" font-size="11" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.35)" letter-spacing=".14em" font-weight="600">MOBPAE</text>

  <!-- EMPLOYEE NODE -->
  <g transform="translate(1130,255)">
    <circle r="58" fill="#0D9488" fill-opacity=".2" filter="url(#f-glow)"/>
    <circle r="86" fill="none" stroke="#0D9488" stroke-opacity=".16" stroke-width="0.75"/>
    <circle r="56" fill="url(#g-node-t)" stroke="#0D9488" stroke-opacity=".75" stroke-width="1.5"/>
    <!-- Person icon -->
    <circle cx="0" cy="-13" r="10" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/>
    <path d="M-18,18 C-18,1 18,1 18,18" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/>
    <rect x="3" y="-1" width="12" height="19" rx="2.5" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.48)" stroke-width="1"/>
    <rect x="5" y="2"  width="8"  height="10" rx="1"   fill="rgba(255,255,255,0.2)"/>
  </g>
  <text x="1130" y="334" text-anchor="middle" font-size="11" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.35)" letter-spacing=".14em" font-weight="600">EMPLOYEE</text>

  <!-- Stats strip -->
  <line x1="160" y1="426" x2="1280" y2="426" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="280" y="452" text-anchor="middle" font-size="20" font-family="Inter,sans-serif" fill="white" font-weight="600">20+</text>
  <text x="280" y="470" text-anchor="middle" font-size="10" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.38)" letter-spacing=".07em">YRS COMBINED EXPERIENCE</text>

  <line x1="460" y1="434" x2="460" y2="478" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <text x="570" y="452" text-anchor="middle" font-size="20" font-family="Inter,sans-serif" fill="white" font-weight="600">Zero</text>
  <text x="570" y="470" text-anchor="middle" font-size="10" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.38)" letter-spacing=".07em">CASH BURDEN ON EMPLOYER</text>

  <line x1="720" y1="434" x2="720" y2="478" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <text x="820" y="452" text-anchor="middle" font-size="20" font-family="Inter,sans-serif" fill="white" font-weight="600">100%</text>
  <text x="820" y="470" text-anchor="middle" font-size="10" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.38)" letter-spacing=".07em">EMPLOYER&#8209;CONTROLLED</text>

  <line x1="980" y1="434" x2="980" y2="478" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <text x="1100" y="452" text-anchor="middle" font-size="20" font-family="Inter,sans-serif" fill="white" font-weight="600">&lt;1 day</text>
  <text x="1100" y="470" text-anchor="middle" font-size="10" font-family="Inter,sans-serif" fill="rgba(255,255,255,0.38)" letter-spacing=".07em">SETUP TIME</text>
</svg>
