<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" role="img" aria-label="A support specialist wearing a headset, seated at a laptop, ready to help">
  <defs>
    <filter id="asBlur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <ellipse cx="300" cy="280" rx="270" ry="220" fill="#e4eaff" filter="url(#asBlur)"/>
  <ellipse cx="430" cy="140" rx="120" ry="96" fill="#fff3de" filter="url(#asBlur)" opacity="0.55"/>

  <circle cx="560" cy="90" r="7" fill="#0047ff"/>
  <circle cx="34" cy="120" r="6" fill="#8fa8ff"/>
  <circle cx="48" cy="470" r="6" fill="#ffb930"/>
  <circle cx="566" cy="440" r="5" fill="#8fa8ff"/>

  <!-- desk -->
  <rect x="30" y="392" width="540" height="16" rx="8" fill="#dfe1ed"/>
  <rect x="30" y="404" width="540" height="8" rx="4" fill="#c7cee6"/>

  <!-- plant, far right, balances the chair on the left -->
  <rect x="512" y="366" width="34" height="30" rx="8" fill="#c7cee6"/>
  <ellipse cx="516" cy="332" rx="14" ry="24" fill="#0047ff" transform="rotate(-18 516 332)"/>
  <ellipse cx="533" cy="322" rx="14" ry="28" fill="#7c96ff" transform="rotate(6 533 322)"/>
  <ellipse cx="546" cy="336" rx="13" ry="22" fill="#0047ff" transform="rotate(24 546 336)"/>

  <!-- coffee cup -->
  <rect x="452" y="372" width="30" height="24" rx="6" fill="#ffffff" stroke="#dfe1ed" stroke-width="2.5"/>
  <path d="M482 378 q14 2 10 16 q-3 9 -12 8" fill="none" stroke="#dfe1ed" stroke-width="3" stroke-linecap="round"/>

  <!-- chair -->
  <rect x="86" y="196" width="164" height="214" rx="46" fill="#eef1fb"/>

  <!-- laptop, right side, balanced against the person on the left -->
  <g>
    <rect x="366" y="330" width="176" height="14" rx="6" fill="#c7cee6"/>
    <path d="M372 330 L536 330 L520 250 C 519 244 514 240 508 240 L400 240 C 394 240 389 244 388 250 Z" fill="#ffffff" stroke="#01022e" stroke-width="3.5"/>
    <rect x="400" y="256" width="108" height="60" rx="8" fill="#eef1fb"/>
    <rect x="410" y="266" width="60" height="9" rx="4.5" fill="#7c96ff"/>
    <rect x="410" y="281" width="42" height="7" rx="3.5" fill="#c7cee6"/>
    <circle cx="480" cy="296" r="13" fill="#0047ff"/>
    <path d="M474 296 L479 301 L488 289" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- back arm, resting near the laptop keyboard -->
  <rect x="292" y="330" width="90" height="30" rx="15" fill="#0047ff" transform="rotate(12 292 330)"/>
  <ellipse cx="378" cy="356" rx="21" ry="17" fill="#e8a978"/>

  <!-- front arm, resting on the desk -->
  <rect x="148" y="336" width="86" height="30" rx="15" fill="#0047ff" transform="rotate(-10 148 336)"/>
  <ellipse cx="150" cy="360" rx="21" ry="17" fill="#e8a978"/>

  <!-- torso -->
  <path d="M110 410 L110 320 C 110 274 146 238 192 238 C 238 238 274 274 274 320 L274 410 Z" fill="#0047ff"/>
  <path d="M168 240 L168 276 L192 262 L216 276 L216 240 Z" fill="#ffffff"/>

  <!-- neck -->
  <rect x="176" y="206" width="32" height="38" rx="14" fill="#e8a978"/>

  <!-- hair, back layer (peeks around the head) -->
  <ellipse cx="192" cy="150" rx="82" ry="78" fill="#1a1f3a"/>

  <!-- ear -->
  <circle cx="264" cy="176" r="12" fill="#e8a978"/>

  <!-- head -->
  <circle cx="196" cy="166" r="66" fill="#e8a978"/>

  <!-- hair, front fringe -->
  <path d="M132 146 C 130 96 160 66 198 66 C 238 66 268 98 264 142 C 250 116 224 100 196 100 C 168 100 144 116 132 146 Z" fill="#1a1f3a"/>

  <!-- face -->
  <circle cx="184" cy="168" r="5" fill="#1a1f3a"/>
  <circle cx="226" cy="168" r="5" fill="#1a1f3a"/>
  <path d="M188 198 Q205 212 224 200" fill="none" stroke="#1a1f3a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="238" cy="184" r="6" fill="#d99568" opacity="0.55"/>

  <!-- headset -->
  <path d="M124 158 Q196 76 268 154" fill="none" stroke="#01022e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="122" cy="166" r="15" fill="#01022e"/>
  <circle cx="270" cy="162" r="15" fill="#01022e"/>
  <path d="M270 176 Q294 190 278 208 Q258 220 240 210" fill="none" stroke="#01022e" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="237" cy="209" r="6.5" fill="#0047ff"/>

  <!-- floating "always here" chip -->
  <rect x="330" y="60" width="176" height="64" rx="20" fill="#ffffff" stroke="#dfe1ed" stroke-width="1.5"/>
  <circle cx="362" cy="92" r="17" fill="#eaf0ff"/>
  <path d="M354 92 L360 98 L372 84" fill="none" stroke="#0047ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="392" y="88" font-family="Poppins" font-size="14" font-weight="700" fill="#01022e">Always here</text>
  <text x="392" y="107" font-family="Poppins" font-size="12" font-weight="500" fill="#667594">Dedicated support</text>
</svg>
